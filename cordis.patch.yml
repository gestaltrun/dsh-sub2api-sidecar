# DeepSeek Harness bundle layer for dsh-sub2api-sidecar. The row's config is
# the composition base; a profile's own cordis.patch.yml or a --patch overlay
# can override any field by restating the row.
- insert:
    - id: dsh-sub2api-sidecar
      name: dsh-sub2api-sidecar
      config:
        enabled: true
        # The published darwin runtime pack intentionally carries a loud Redis
        # placeholder. The installable bundle skips it until a trusted portable
        # binary lands; deployments with Redis can override this row.
        redis:
          skip: true
